<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chook-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C2A"/>
      <stop offset="100%" stop-color="#041B12"/>
    </linearGradient>
    <style>
      .cat-fav-path {
        fill: none;
        stroke: #FFFFFF;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Circular background for browser tab visibility -->
  <circle cx="64" cy="64" r="60" fill="url(#chook-fav-bg)"/>

  <!-- Cat Line-Art Profile (Facing Right, scaled to fit the circle perfectly) -->
  <g transform="translate(18, 18) scale(0.85)">
    <!-- Back of neck and outer ear curve -->
    <path class="cat-fav-path" stroke-width="4.5" d="M 15,115 C 10,85 22,60 35,40 C 37.5,36 38.5,31 35.5,26.5 C 32,20 28,11 29.5,5 C 30.5,1.5 35.5,3 38,8 C 44,18.5 53.5,36 57,44" />
    
    <!-- Front Ear -->
    <path class="cat-fav-path" stroke-width="4.5" d="M 50.5,38.5 C 54,25.5 59.5,10.5 64,2 C 65,0 68.5,0 69,2 C 73,14 71.5,27 70.5,35" />
    
    <!-- Inner ear shadows/details -->
    <path class="cat-fav-path" stroke-width="2" stroke-opacity="0.5" d="M 37.5,24 C 42,26 44,29 43.5,33.5" />
    <path class="cat-fav-path" stroke-width="2" stroke-opacity="0.75" d="M 57.5,26.5 C 61,28 62.5,31.5 61.5,35" />
    
    <!-- Forehead, Nose, Snout, Mouth, Chin, Neck -->
    <path class="cat-fav-path" stroke-width="4.5" d="M 70.5,35 C 75,41.5 81.5,44 88.5,45 C 91,45.5 92.5,47 91.5,49.5 C 90,52 86,53 83,54.5 C 79.5,56 78.5,58 80.5,60.5 C 81.5,61.5 83.5,61.5 80,65 C 75.5,68.5 72,63.5 67,63.5 C 62,63.5 58.5,67.5 55.5,71.5 C 50.5,75.5 50.5,86 52,97 C 53.5,105 54.5,111 54.5,115" />
    
    <!-- Eye outline and pupil -->
    <path class="cat-fav-path" stroke-width="3" d="M 72.5,43.5 C 75,41 78.5,41.5 78.5,44 Q 75.5,47 72.5,43.5 Z" fill="#FFFFFF"/>
    
    <!-- Whiskers -->
    <path class="cat-fav-path" stroke-width="2.5" d="M 78,56 C 90,55.5 101.5,58 110,62" />
    <path class="cat-fav-path" stroke-width="2.5" d="M 76.5,58.5 C 90,61 100.5,66 107,71.5" />
    <path class="cat-fav-path" stroke-width="2.5" d="M 75.5,61 C 87.5,66 96.5,72.5 102,79" />
  </g>
</svg>
